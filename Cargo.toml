[package]
name = "lib-sokoban"
version = "0.3.3"
edition = "2021"
repository = "https://github.com/jarry-xiao/sokoban"
authors = ["jarry-xiao <jarry.xiao@gmail.com>"]
description = "Sokoban: compact, efficient data structures packed into contiguous byte arrays"
license = "MIT OR Apache-2.0"

[lib]
name = "sokoban"
path = "src/lib.rs"
test = true
doctest = true
bench = true
doc = true
proc-macro = false
harness = true
edition = "2021"
crate-type = ["lib"]
required-features = []

[dependencies]
thiserror = { version = "2.0.17", default-features = false }
bytemuck = "1.24.0"
num-derive = "0.4.2"
num-traits = "0.2.15"
libc-print = "0.1.23"
hashbrown = { version = "0.16.0", default-features = false, features = [
    "default-hasher",
] }

[dev-dependencies]
rand_distr = "0.4.3"
itertools = "0.14.0"
rand = "0.7"
tokio = { version = "1.48.0", features = ["full"] }
